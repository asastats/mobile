<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ASA Stats</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.5rem; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      box-sizing: border-box; background: #140a2e; color: #f2f0fa;
      font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    img { width: min(60vw, 260px); height: auto; }
    h1 { margin: 0; font-size: 1.3rem; font-weight: 600; }
    p { margin: 0; color: #b9b3d1; }
    button {
      min-width: 9rem; padding: .8rem 1.6rem; border: 0; border-radius: .6rem;
      background: #13d8d8; color: #140a2e; font: inherit; font-weight: 600;
    }
    button:active { opacity: .8; }
  </style>
  <script src="server-url.js"></script>
</head>
<!-- No plugins here: Android gives the errorPath page no bridge. -->
<body>
  <img src="asastats-logo.svg" alt="ASA Stats">
  <h1>No connection</h1>
  <p>ASA Stats needs the internet. Check your connection and try again.</p>
  <button type="button" id="retry">Retry</button>
  <script>
    document.getElementById("retry").addEventListener("click", function () {
      location.href = window.ASASTATS_URL || "https://www.asastats.com";
    });
  </script>
</body>
</html>
