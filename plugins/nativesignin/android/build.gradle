ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    credentialsVersion = '1.5.0'
    googleIdVersion = '1.1.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'jacoco'

android {
    namespace = "com.asastats.nativesignin"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        debug {
            enableUnitTestCoverage = true
        }
        release {
            minifyEnabled false
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.credentials:credentials:$credentialsVersion"
    // Credential Manager's Play services back end, below Android 14 too.
    implementation "androidx.credentials:credentials-play-services-auth:$credentialsVersion"
    implementation "com.google.android.libraries.identity.googleid:googleid:$googleIdVersion"
    testImplementation "junit:junit:$junitVersion"
}

// NativeSignInPlugin only adapts Capacitor and Credential Manager; its logic is
// in the class checked here, and the sheet on a device is the Appium suite's.
def coverageClasses = fileTree("$buildDir/intermediates/javac/debug") {
    include '**/NativeSignInRequest*.class'
}
def coverageData = fileTree(buildDir) { include '**/testDebugUnitTest.exec' }

tasks.register('jacocoCoverageCheck', JacocoCoverageVerification) {
    dependsOn 'testDebugUnitTest'
    executionData.from = coverageData
    sourceDirectories.from = files('src/main/java')
    classDirectories.from = coverageClasses
    violationRules {
        rule {
            limit { counter = 'LINE'; minimum = 1.0 }
            limit { counter = 'BRANCH'; minimum = 1.0 }
        }
    }
}

// The same classes as an XML report, for Codecov (.github/workflows/android.yml).
tasks.register('jacocoCoverageReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    executionData.from = coverageData
    sourceDirectories.from = files('src/main/java')
    classDirectories.from = coverageClasses
    reports {
        xml.required = true
        html.required = false
    }
}
