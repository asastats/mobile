ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxBiometricVersion = project.hasProperty('androidxBiometricVersion') ? rootProject.ext.androidxBiometricVersion : '1.1.0'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'jacoco'

android {
    namespace = "com.asastats.applock"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        debug {
            enableUnitTestCoverage = true
        }
        release {
            minifyEnabled false
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.biometric:biometric:$androidxBiometricVersion"
    testImplementation "junit:junit:$junitVersion"
}

// AppLockPlugin only adapts Capacitor, the cover and BiometricPrompt; its logic is
// LockPolicy, checked here (capacitor/O2-BIOMETRIC-LOCK-DESIGN.md).
tasks.register('jacocoCoverageCheck', JacocoCoverageVerification) {
    dependsOn 'testDebugUnitTest'
    executionData.from = fileTree(buildDir) { include '**/testDebugUnitTest.exec' }
    sourceDirectories.from = files('src/main/java')
    classDirectories.from = fileTree("$buildDir/intermediates/javac/debug") {
        include '**/LockPolicy*.class'
    }
    violationRules {
        rule {
            limit { counter = 'LINE'; minimum = 1.0 }
            limit { counter = 'BRANCH'; minimum = 1.0 }
        }
    }
}
