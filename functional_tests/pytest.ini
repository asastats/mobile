# Its own config: the root pytest.ini measures scripts/ coverage, which these tests do not touch.
[pytest]
testpaths = .
addopts = -p no:django -p no:cacheprovider
markers =
    live: the debug APK against www.asastats.com, read-only
    local: the debug APK against a Django server started in CI, with a test account
    android: Android only (Back, App Links, browser sheet, connectivity); skipped on iOS
