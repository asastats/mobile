# Secret names are listed in capacitor/USER-ACTIONS.md (planning repo) and README.md.
name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # One number per commit on both platforms: base + minutes from buildEpoch to the commit.
      - name: Build number
        run: |
          NUMBER=$(node -p 'const { buildNumber, buildEpoch } = require("./package.json");
            buildNumber + Math.floor((process.argv[1] * 1000 - Date.parse(buildEpoch)) / 60000)' \
            "$(git log -1 --format=%ct)")
          echo "Build number $NUMBER"
          echo "ASASTATS_BUILD_NUMBER=$NUMBER" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx cap sync android
        env:
          ASASTATS_RELEASE: "1"

      # Optional: without it Gradle skips google-services and push does not work.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set: this build has no push notifications"
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: WebAuth plugin tests, 100 % coverage of its logic
        working-directory: android
        run: ./gradlew --no-daemon :asastats-webauth:jacocoCoverageCheck :asastats-webauth:jacocoCoverageReport

      - name: AppLock plugin tests, 100 % coverage of its logic
        working-directory: android
        run: ./gradlew --no-daemon :asastats-applock:jacocoCoverageCheck :asastats-applock:jacocoCoverageReport

      - name: NativeSignIn plugin tests, 100 % coverage of its logic
        working-directory: android
        run: ./gradlew --no-daemon :asastats-nativesignin:jacocoCoverageCheck :asastats-nativesignin:jacocoCoverageReport

      - name: FlutterData plugin tests, 100 % coverage of its logic
        working-directory: android
        run: ./gradlew --no-daemon :asastats-flutterdata:jacocoCoverageCheck :asastats-flutterdata:jacocoCoverageReport

      - name: Upload plugins Java coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: plugins/webauth/android/build/reports/jacoco/jacocoCoverageReport/jacocoCoverageReport.xml,plugins/applock/android/build/reports/jacoco/jacocoCoverageReport/jacocoCoverageReport.xml,plugins/nativesignin/android/build/reports/jacoco/jacocoCoverageReport/jacocoCoverageReport.xml,plugins/flutterdata/android/build/reports/jacoco/jacocoCoverageReport/jacocoCoverageReport.xml
          disable_search: true
          plugins: noop
          flags: plugins-java
          name: plugins-java-coverage

      # Optional: one kept key, so each debug APK installs over the last (README.md).
      - name: Debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::notice::ANDROID_DEBUG_KEYSTORE_BASE64 not set: this debug APK is signed with a new key"
            exit 0
          fi
          echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "ANDROID_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Debug APK (sideload)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: asastats-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set: skipping the release bundle"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "file=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      - name: Release bundle (Play)
        if: steps.keystore.outputs.file
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - if: steps.keystore.outputs.file
        uses: actions/upload-artifact@v7
        with:
          name: asastats-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
