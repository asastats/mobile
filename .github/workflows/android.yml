# Secret names are listed in capacitor/USER-ACTIONS.md (planning repo) and README.md.
name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build number counts commits

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # One number per commit on both platforms: package.json's base + commits.
      - name: Build number
        run: |
          NUMBER=$(( $(node -p 'require("./package.json").buildNumber') + $(git rev-list --count HEAD) ))
          echo "Build number $NUMBER"
          echo "ASASTATS_BUILD_NUMBER=$NUMBER" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx cap sync android
        env:
          ASASTATS_RELEASE: "1"

      # Optional: without it Gradle skips google-services and push does not work.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set: this build has no push notifications"
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: WebAuth plugin tests, 100 % coverage of its logic
        working-directory: android
        run: ./gradlew --no-daemon :asastats-webauth:jacocoCoverageCheck

      - name: Debug APK (sideload)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: asastats-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set: skipping the release bundle"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "file=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      - name: Release bundle (Play)
        if: steps.keystore.outputs.file
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - if: steps.keystore.outputs.file
        uses: actions/upload-artifact@v4
        with:
          name: asastats-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
