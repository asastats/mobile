# Unit tests that need no device: Jest for the shell, pytest for scripts/.
# Both fail under 100 % coverage (jest.config.cjs, pytest.ini).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: npm ci
      - run: npm test
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
