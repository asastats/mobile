# Unit tests that need no device: Jest for the shell, pytest for scripts/.
# Both fail under 100 % coverage (jest.config.cjs, pytest.ini); reports go to Codecov.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: npm ci
      - run: npm test -- --coverageReporters=text --coverageReporters=lcov
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov-report=xml:coverage-python.xml

      - name: Upload shell JavaScript coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          plugins: noop
          flags: shell-javascript
          name: shell-javascript-coverage

      - name: Upload scripts Python coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-python.xml
          disable_search: true
          plugins: noop
          flags: scripts-python
          name: scripts-python-coverage
