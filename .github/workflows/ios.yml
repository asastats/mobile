# Secret names are listed in capacitor/USER-ACTIONS.md (planning repo) and README.md.
# Without them the job only compiles for the simulator.
name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # One number per commit on both platforms: base + minutes from buildEpoch to the commit.
      - name: Build number
        run: |
          NUMBER=$(node -p 'const { buildNumber, buildEpoch } = require("./package.json");
            buildNumber + Math.floor((process.argv[1] * 1000 - Date.parse(buildEpoch)) / 60000)' \
            "$(git log -1 --format=%ct)")
          echo "Build number $NUMBER"
          echo "ASASTATS_BUILD_NUMBER=$NUMBER" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx cap sync ios
        env:
          ASASTATS_RELEASE: "1"

      # Required: project.pbxproj lists the file as a resource, so Xcode fails without it.
      - name: Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 is not set (see README.md, Secrets)"
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > ios/App/App/GoogleService-Info.plist

      - name: Signing secrets
        id: signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::notice::App Store Connect API key secrets not set: simulator build only"
            exit 0
          fi
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          echo "key=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_OUTPUT"

      # Without a kept certificate Xcode creates a new one per run until Apple refuses (logbook).
      - name: Development certificate
        if: steps.signing.outputs.key
        env:
          IOS_DEV_P12_BASE64: ${{ secrets.IOS_DEV_P12_BASE64 }}
          IOS_DEV_P12_PASSWORD: ${{ secrets.IOS_DEV_P12_PASSWORD }}
        run: |
          if [ -z "$IOS_DEV_P12_BASE64" ]; then
            echo "::warning::IOS_DEV_P12_BASE64 is not set: Xcode creates another development certificate"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$IOS_DEV_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dev.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dev.p12" -P "$IOS_DEV_P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/dev.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: WebAuth plugin tests
        working-directory: plugins/webauth
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c \
            "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          xcodebuild test -scheme AsastatsWebauth -destination "id=$SIM" \
            -enableCodeCoverage YES -resultBundlePath "$RUNNER_TEMP/webauth.xcresult"

      - name: WebAuth plugin coverage, 100 % of its logic
        run: |
          RESULT="$RUNNER_TEMP/webauth.xcresult"
          FILE=$(xcrun xccov view --report --json "$RESULT" | python3 -c "
          import json, sys
          files = [f for t in json.load(sys.stdin)['targets'] for f in t['files']]
          logic = [f for f in files if f['name'] == 'WebAuthRequest.swift']
          assert logic, 'WebAuthRequest.swift not in the coverage report'
          print(logic[0]['lineCoverage'] == 1, logic[0]['lineCoverage'], logic[0]['path'])
          ")
          read -r FULL COVERAGE SOURCE <<< "$FILE"
          echo "WebAuthRequest.swift: line coverage $COVERAGE"
          if [ "$FULL" != "True" ]; then
            # Every line with its execution count; the 0s are the ones to cover.
            xcrun xccov view --archive --file "$SOURCE" "$RESULT"
            exit 1
          fi

      - name: AppLock plugin tests
        working-directory: plugins/applock
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c \
            "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          xcodebuild test -scheme AsastatsApplock -destination "id=$SIM" \
            -enableCodeCoverage YES -resultBundlePath "$RUNNER_TEMP/applock.xcresult"

      - name: AppLock plugin coverage, 100 % of its logic
        run: |
          RESULT="$RUNNER_TEMP/applock.xcresult"
          FILE=$(xcrun xccov view --report --json "$RESULT" | python3 -c "
          import json, sys
          files = [f for t in json.load(sys.stdin)['targets'] for f in t['files']]
          logic = [f for f in files if f['name'] == 'LockPolicy.swift']
          assert logic, 'LockPolicy.swift not in the coverage report'
          print(logic[0]['lineCoverage'] == 1, logic[0]['lineCoverage'], logic[0]['path'])
          ")
          read -r FULL COVERAGE SOURCE <<< "$FILE"
          echo "LockPolicy.swift: line coverage $COVERAGE"
          if [ "$FULL" != "True" ]; then
            # Every line with its execution count; the 0s are the ones to cover.
            xcrun xccov view --archive --file "$SOURCE" "$RESULT"
            exit 1
          fi

      - name: NativeSignIn plugin tests
        working-directory: plugins/nativesignin
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c \
            "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          xcodebuild test -scheme AsastatsNativesignin -destination "id=$SIM" \
            -enableCodeCoverage YES -resultBundlePath "$RUNNER_TEMP/nativesignin.xcresult"

      - name: NativeSignIn plugin coverage, 100 % of its logic
        run: |
          RESULT="$RUNNER_TEMP/nativesignin.xcresult"
          FILE=$(xcrun xccov view --report --json "$RESULT" | python3 -c "
          import json, sys
          files = [f for t in json.load(sys.stdin)['targets'] for f in t['files']]
          logic = [f for f in files if f['name'] == 'NativeSignInRequest.swift']
          assert logic, 'NativeSignInRequest.swift not in the coverage report'
          print(logic[0]['lineCoverage'] == 1, logic[0]['lineCoverage'], logic[0]['path'])
          ")
          read -r FULL COVERAGE SOURCE <<< "$FILE"
          echo "NativeSignInRequest.swift: line coverage $COVERAGE"
          if [ "$FULL" != "True" ]; then
            # Every line with its execution count; the 0s are the ones to cover.
            xcrun xccov view --archive --file "$SOURCE" "$RESULT"
            exit 1
          fi

      - name: Simulator build
        if: ${{ !steps.signing.outputs.key }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Archive
        if: steps.signing.outputs.key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.signing.outputs.key }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$(node -p 'require("./package.json").version')" \
            CURRENT_PROJECT_VERSION="$ASASTATS_BUILD_NUMBER" \
            archive

      - name: Export and upload to TestFlight
        if: steps.signing.outputs.key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.signing.outputs.key }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
