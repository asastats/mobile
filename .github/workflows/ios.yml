# Secret names are listed in capacitor/USER-ACTIONS.md (planning repo) and README.md.
# Without them the job only compiles for the simulator.
name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build number counts commits

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # One number per commit on both platforms: package.json's base + commits.
      - name: Build number
        run: |
          NUMBER=$(( $(node -p 'require("./package.json").buildNumber') + $(git rev-list --count HEAD) ))
          echo "Build number $NUMBER"
          echo "ASASTATS_BUILD_NUMBER=$NUMBER" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx cap sync ios
        env:
          ASASTATS_RELEASE: "1"

      # Required: project.pbxproj lists the file as a resource, so Xcode fails without it.
      - name: Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 is not set (see README.md, Secrets)"
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > ios/App/App/GoogleService-Info.plist

      - name: Signing secrets
        id: signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::notice::App Store Connect API key secrets not set: simulator build only"
            exit 0
          fi
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          echo "key=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_OUTPUT"

      - name: WebAuth plugin tests
        working-directory: plugins/webauth
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c \
            "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          xcodebuild test -scheme AsastatsWebauth -destination "id=$SIM" \
            -enableCodeCoverage YES -resultBundlePath "$RUNNER_TEMP/webauth.xcresult"

      - name: WebAuth plugin coverage, 100 % of its logic
        run: |
          RESULT="$RUNNER_TEMP/webauth.xcresult"
          FILE=$(xcrun xccov view --report --json "$RESULT" | python3 -c "
          import json, sys
          files = [f for t in json.load(sys.stdin)['targets'] for f in t['files']]
          logic = [f for f in files if f['name'] == 'WebAuthRequest.swift']
          assert logic, 'WebAuthRequest.swift not in the coverage report'
          print(logic[0]['lineCoverage'] == 1, logic[0]['lineCoverage'], logic[0]['path'])
          ")
          read -r FULL COVERAGE SOURCE <<< "$FILE"
          echo "WebAuthRequest.swift: line coverage $COVERAGE"
          if [ "$FULL" != "True" ]; then
            # Every line with its execution count; the 0s are the ones to cover.
            xcrun xccov view --archive --file "$SOURCE" "$RESULT"
            exit 1
          fi

      - name: Simulator build
        if: ${{ !steps.signing.outputs.key }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Archive
        if: steps.signing.outputs.key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.signing.outputs.key }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$(node -p 'require("./package.json").version')" \
            CURRENT_PROJECT_VERSION="$ASASTATS_BUILD_NUMBER" \
            archive

      - name: Export and upload to TestFlight
        if: steps.signing.outputs.key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.signing.outputs.key }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
