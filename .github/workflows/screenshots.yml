# Store screenshots of the live site in the app, by hand only. Download them from
# the run's Artifacts. Sizes and the upload: capacitor/FASTLANE-STORE-GUIDE.md.
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      address:
        description: "Algorand address for the address scenes"
        required: true
      bundle:
        description: "Bundle id (40 characters) for the bundle scene; empty skips it"
        required: false

env:
  ASASTATS_SCREENSHOT_ADDRESS: ${{ inputs.address }}
  ASASTATS_SCREENSHOT_BUNDLE: ${{ inputs.bundle }}
  # Optional: signed in as the review demo account; empty means signed out.
  APP_TEST_USER: ${{ secrets.REVIEW_DEMO_USER }}
  APP_TEST_PASSWORD: ${{ secrets.REVIEW_DEMO_PASSWORD }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Play refuses a side longer than twice the other, so no 1080x2400 phone.
          - slot: phone
            profile: pixel_2
            size: 1080x1920
          - slot: seven-inch
            profile: Nexus 7 2013
            size: 1200x1920
          - slot: ten-inch
            profile: pixel_tablet
            size: 1600x2560
    env:
      ASASTATS_SCREENSHOT_SLOT: ${{ matrix.slot }}
      ASASTATS_SCREENSHOT_SIZE: ${{ matrix.size }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: functional_tests/requirements.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: npm ci
      - run: npx cap sync android

      # Same as functional.yml: without it the build has no push.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          fi

      - name: Debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Appium and its Android driver
        run: |
          npm install -g appium@3.8.0
          appium driver install uiautomator2@8.7.0
          python -m pip install -r functional_tests/requirements.txt

      # As functional.yml: the AVD needs ~7.4 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk /usr/local/share/boost
          df -h /

      # As functional.yml: a cached AVD with a boot snapshot, one per profile.
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-${{ matrix.slot }}

      - name: AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          cores: 4
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated"

      - name: Screenshots on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          cores: 4
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash functional_tests/run-android.sh screenshots

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-android-${{ matrix.slot }}
          path: functional_tests/screenshots/
          if-no-files-found: warn

      - name: Appium log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: appium-log-${{ matrix.slot }}
          path: |
            functional_tests/appium.log
            functional_tests/failures/

  ios:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASASTATS_PLATFORM: ios
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: functional_tests/requirements.txt

      - run: npm ci
      - run: npx cap sync ios

      # Required: project.pbxproj lists the file as a resource.
      - name: Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > ios/App/App/GoogleService-Info.plist

      # As functional-ios.yml: CAPACITOR_DEBUG makes the WebView inspectable for Appium.
      - name: Simulator build
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CAPACITOR_DEBUG=true build

      - name: Appium and its iOS driver
        run: |
          npm install -g appium@3.8.0
          appium driver install xcuitest@12.17.3
          python -m pip install -r functional_tests/requirements.txt

      # As functional-ios.yml, docs/logbook.md.
      - name: WebDriverAgent build
        run: |
          xcrun --sdk iphonesimulator --show-sdk-version
          appium driver run xcuitest build-wda || appium driver run xcuitest build-wda

      # Slot, simulator name pattern (_ for a space), size. The newest runtime and name win.
      - name: Screenshots on the simulators
        working-directory: functional_tests
        run: |
          appium --keep-alive-timeout 1800 > appium.log 2>&1 &
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:4723/status > /dev/null && break
            sleep 1
          done
          STATUS=0
          while read -r SLOT PREFIX SIZE <&3; do
            SIM=$(xcrun simctl list devices available -j | python3 -c "
          import fnmatch, json, sys
          pattern = sys.argv[1].replace('_', ' ')
          d = json.load(sys.stdin)['devices']
          found = [([int(p) for p in r.split('iOS-')[1].split('-')], x['name'], x['udid'])
                   for r in d if 'iOS-' in r for x in d[r] if fnmatch.fnmatch(x['name'], pattern)]
          print(sorted(found)[-1][2])
          " "$PREFIX")
            echo "$SLOT: $SIM"
            xcrun simctl boot "$SIM"
            xcrun simctl bootstatus "$SIM"
            xcrun simctl status_bar "$SIM" override --time "9:41" --dataNetwork wifi --wifiMode active \
              --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
            ASASTATS_SIMULATOR="$SIM" ASASTATS_SCREENSHOT_SLOT="$SLOT" ASASTATS_SCREENSHOT_SIZE="$SIZE" \
              python -m pytest -c pytest.ini -v -m screenshots || STATUS=1
            xcrun simctl shutdown "$SIM"
          done 3<<'DEVICES'
          iphone iPhone_*_Pro_Max 1320x2868
          ipad iPad_Pro_13-inch* 2064x2752
          DEVICES
          exit $STATUS

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-ios
          path: functional_tests/screenshots/
          if-no-files-found: warn

      - name: Appium log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: appium-log-ios
          path: |
            functional_tests/appium.log
            functional_tests/failures/
