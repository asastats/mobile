# Appium on an Android emulator: the debug APK against the live site, read-only.
# Tests: functional_tests/; plan: capacitor/MOBILE-TESTING.md (planning repo).
name: Functional (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: functional_tests/requirements.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: npm ci
      - run: npx cap sync android

      # Same as android.yml: without it the build has no push.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set: this build has no push notifications"
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Appium and its Android driver
        run: |
          npm install -g appium@3.8.0
          appium driver install uiautomator2@8.7.0
          python -m pip install -r functional_tests/requirements.txt

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash functional_tests/run-android.sh

      - name: Appium log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: functional_tests/appium.log
