# Appium on an Android emulator. Tests: functional_tests/; plan:
# capacitor/MOBILE-TESTING.md (planning repo).
#   live:  the debug APK against www.asastats.com, read-only.
#   local: the debug APK against frontend's Django, started here with a test account.
name: Functional (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: functional_tests/requirements.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: npm ci
      - run: npx cap sync android

      # Same as android.yml: without it the build has no push.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set: this build has no push notifications"
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Appium and its Android driver
        run: |
          npm install -g appium@3.8.0
          appium driver install uiautomator2@8.7.0
          python -m pip install -r functional_tests/requirements.txt

      # A cold API 34 boot outran the default timeout (2026-10-26): a cached AVD
      # with a boot snapshot, as the runner's README recommends.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64

      - name: AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          cores: 4
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated"

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          cores: 4
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash functional_tests/run-android.sh live

      - name: Appium log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log-live
          path: functional_tests/appium.log

  local:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The emulator reaches the runner as 10.0.2.2.
      ASASTATS_URL: http://10.0.2.2:8000
      ASASTATS_DB_URL: postgresql://postgres:postgres@localhost:5432/website_db
      APP_TEST_USER: apptester
      APP_TEST_PASSWORD: app-tester-pw-1
      DJANGO_SETTINGS_MODULE: app_settings
      PYTHONPATH: ${{ github.workspace }}/functional_tests/server

    # As frontend's build.yml.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: website_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Frontend, at its main branch
        uses: actions/checkout@v4
        with:
          repository: asastats/frontend
          path: frontend
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Website dependencies
        run: |
          python -m pip install -r frontend/website/requirements/development.txt
          python -m pip install -r functional_tests/requirements.txt

      - name: Website env file
        run: |
          {
            echo SECRET_KEY="functional-tests-only"
            # frontend's system check (asastats.E001) refuses to start without it;
            # no engine runs here, so any value will do.
            echo SIMPLE_JWT_KEY="functional-tests-only-jwt"
            echo DATABASE_NAME="website_db"
            echo DATABASE_USER="postgres"
            echo DATABASE_PASSWORD="postgres"
            echo REDIS_PORT_LOCAL="6379"
            echo PGPASSFILE=""
          } > frontend/website/.env

      - name: Database and the test account
        run: |
          python frontend/website/manage.py migrate --noinput
          python frontend/website/manage.py shell < functional_tests/server/seed.py

      - name: Start the website
        run: |
          nohup python frontend/website/manage.py runserver 0.0.0.0:8000 --noreload > runserver.log 2>&1 &
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:8000/accounts/login/ > /dev/null && exit 0
            sleep 1
          done
          cat runserver.log
          exit 1

      - run: npm ci
      # ASASTATS_URL (job env) bakes the local server into the APK, cleartext allowed.
      - run: npx cap sync android

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set: the push test is skipped"
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          echo "ASASTATS_PUSH=1" >> "$GITHUB_ENV"

      - name: Debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Appium and its Android driver
        run: |
          npm install -g appium@3.8.0
          appium driver install uiautomator2@8.7.0

      # A cold API 34 boot outran the default timeout (2026-10-26): a cached AVD
      # with a boot snapshot, as the runner's README recommends.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64

      - name: AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          cores: 4
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated"

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # google_apis carries Play services, which FCM needs for a token.
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          cores: 4
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash functional_tests/run-android.sh local

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-local
          path: |
            functional_tests/appium.log
            runserver.log
