name: Functional (iOS)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASASTATS_PLATFORM: ios
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: functional_tests/requirements.txt

      - run: npm ci
      - run: npx cap sync ios

      # Required: project.pbxproj lists the file as a resource.
      - name: Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > ios/App/App/GoogleService-Info.plist

      # CAPACITOR_DEBUG (Info.plist) makes the WebView inspectable, which Appium needs; SPM Capacitor ignores #if DEBUG.
      - name: Simulator build
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CAPACITOR_DEBUG=true build

      - name: Appium and its iOS driver
        run: |
          npm install -g appium@3.8.0
          appium driver install xcuitest@12.17.3
          python -m pip install -r functional_tests/requirements.txt

      - name: Boot a simulator
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c \
            "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM"
          echo "ASASTATS_SIMULATOR=$SIM" >> "$GITHUB_ENV"

      # The first session otherwise builds it (~7 min); docs/logbook.md, 2026-10-28.
      - name: WebDriverAgent build
        run: appium driver run xcuitest build-wda

      - name: Run on the simulator
        working-directory: functional_tests
        run: |
          # Seconds; the 600 default cuts off a first session still starting.
          appium --keep-alive-timeout 1800 > appium.log 2>&1 &
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:4723/status > /dev/null && break
            sleep 1
          done
          python -m pytest -c pytest.ini -v -m live

      - name: Appium log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: appium-log-ios
          path: |
            functional_tests/appium.log
            functional_tests/failures/
