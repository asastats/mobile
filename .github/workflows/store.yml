# Store listings and releases through fastlane/Fastfile, by hand only. Builds come from
# ios.yml (TestFlight) and android.yml (Play internal). Steps: capacitor/FASTLANE-STORE-GUIDE.md.
name: Store

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "What to do"
        type: choice
        options:
          - download listings
          - ios listing
          - ios submit
          - android listing
          - android production
          - android complete
      build_number:
        description: "ios submit: the TestFlight build number, e.g. 118178"
        required: false
      rollout:
        description: "android production: share of users, 0.2 = 20 %"
        required: false
        default: "0.2"

env:
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"

jobs:
  # Writes the stores' current texts and images as an artifact, to commit under fastlane/.
  download:
    if: inputs.lane == 'download listings'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: App Store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          rm -rf fastlane/metadata fastlane/screenshots
          umask 077
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          python3 -c "import json, os, sys; print(json.dumps({'key_id': os.environ['ASC_KEY_ID'],
            'issuer_id': os.environ['ASC_ISSUER_ID'], 'key': open(sys.argv[1]).read(), 'in_house': False}))" \
            "$RUNNER_TEMP/AuthKey.p8" > "$RUNNER_TEMP/asc.json"
          bundle exec fastlane deliver download_metadata --api_key_path "$RUNNER_TEMP/asc.json" --app_identifier com.asastats.app --force
          bundle exec fastlane deliver download_screenshots --api_key_path "$RUNNER_TEMP/asc.json" --app_identifier com.asastats.app

      - name: Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON_BASE64 is not set: Play listing not downloaded"
            exit 0
          fi
          umask 077
          echo "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > "$RUNNER_TEMP/play.json"
          bundle exec fastlane supply init --package_name com.asastats.app --json_key "$RUNNER_TEMP/play.json"

      - uses: actions/upload-artifact@v7
        with:
          name: store-listings
          path: |
            fastlane/metadata/
            fastlane/screenshots/

  ios:
    if: startsWith(inputs.lane, 'ios ')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          REVIEW_DEMO_USER: ${{ secrets.REVIEW_DEMO_USER }}
          REVIEW_DEMO_PASSWORD: ${{ secrets.REVIEW_DEMO_PASSWORD }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          LANE: ${{ inputs.lane }}
        run: |
          umask 077
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          export APP_VERSION=$(node -p 'require("./package.json").version')
          bundle exec fastlane $LANE

  android:
    if: startsWith(inputs.lane, 'android ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Fastlane
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          ROLLOUT: ${{ inputs.rollout }}
          LANE: ${{ inputs.lane }}
        run: |
          umask 077
          echo "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > "$RUNNER_TEMP/play.json"
          export PLAY_JSON_KEY_PATH="$RUNNER_TEMP/play.json"
          bundle exec fastlane $LANE
